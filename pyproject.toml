[project]
name = "py-document-processor"
version = "0.1.6"
description = "A python GUI app to process documents and prepare their contents for different contexts."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "pyside6",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
py-document-processor = "src.main:main"
main = "src.main:main"
test = "pytest:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "word: integration tests that need Microsoft Word on Windows (run with -m word)",
]
addopts = "-m 'not word'"
