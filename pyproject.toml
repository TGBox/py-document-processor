[project]
name = "py-document-processor"
version = "0.1.3"
description = "A python GUI app to process documents and prepare their contents for different contexts."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyside6",
]

[project.scripts]
py-document-processor = "src.main:main"
main = "src.main:main"
test = "pytest:main"
build = "src.build:main"
format = "src.tools:format_code"
lint = "src.tools:lint_code"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100